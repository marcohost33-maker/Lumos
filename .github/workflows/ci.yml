name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege at the top level; jobs opt back in to only what they need.
permissions: {}

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout only; upload-artifact uses the Actions runtime token
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests with coverage
        run: |
          pytest --cov=lumos --cov-report=term --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  web-browser:
    # The web companion's key storage in real Chromium under file:// (G1 gate for the
    # session-only key). LUMOS_REQUIRE_BROWSER makes a missing browser fail, not skip.
    name: web key storage (Chromium, file://)
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout only
    env:
      LUMOS_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install package, dev deps and hash-pinned Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install --require-hashes --only-binary :all: -r requirements-web-browser.txt
          python -m playwright install --with-deps chromium

      - name: Run the browser gate
        run: |
          pytest tests/test_web_key_storage_browser.py -v -rs
